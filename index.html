<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTC Scouting</title>
<style>
  :root {
    --bg: #f4f5f8; --panel: #ffffff; --panel2: #eef0f5; --border: #e2e4ea;
    --text: #1b1d24; --muted: #6b7080; --accent: #d32f2f; --accent-soft: #fdeaea;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  :root[data-theme="dark"] {
    --bg: #14161c; --panel: #1d2029; --panel2: #262a35; --border: #2f3440;
    --text: #e8eaf0; --muted: #9097a8; --accent: #ff5a5a; --accent-soft: #3a2326;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  a { color: inherit; text-decoration: none; }
  .muted { color: var(--muted); }

  /* navbar */
  nav { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--border); }
  .nav-in { max-width: 1100px; margin: 0 auto; padding: .6rem 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .brand { font-weight: 800; font-size: 1.2rem; color: var(--accent); letter-spacing: .3px; }
  .links { display: flex; gap: .25rem; }
  .links a { padding: .4rem .8rem; border-radius: 8px; color: var(--muted); font-weight: 600; }
  .links a:hover { background: var(--panel2); color: var(--text); }
  .links a.active { background: var(--accent-soft); color: var(--accent); }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: .6rem; }
  .search { position: relative; }
  .search input { width: 260px; max-width: 100%; padding: .5rem .8rem; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); }
  .search input:focus { outline: 2px solid var(--accent); }
  #gresults { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); overflow: hidden; }
  #gresults[hidden] { display: none; }
  .hit { padding: .5rem .8rem; cursor: pointer; }
  .hit:hover { background: var(--accent-soft); }
  /* theme toggle — circular icon button, pinned to the far right of the navbar */
  .theme-btn { position: relative; flex: none; width: 2.4rem; height: 2.4rem; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 999px; background: var(--panel2); color: var(--muted); cursor: pointer; transition: color .2s, background-color .2s, border-color .2s, transform .15s; -webkit-tap-highlight-color: transparent; }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .theme-btn:active { transform: scale(.9); }
  .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-btn svg { position: absolute; inset: 0; margin: auto; width: 1.2rem; height: 1.2rem; transition: opacity .25s ease, transform .4s ease; }
  .theme-btn .ico-sun { opacity: 1; transform: rotate(0) scale(1); }
  .theme-btn .ico-moon { opacity: 0; transform: rotate(-90deg) scale(.4); }
  :root[data-theme="dark"] .theme-btn .ico-sun { opacity: 0; transform: rotate(90deg) scale(.4); }
  :root[data-theme="dark"] .theme-btn .ico-moon { opacity: 1; transform: rotate(0) scale(1); }

  /* FTCScout status — floating "i" button, bottom right under the table */
  #apiinfo { position: fixed; right: 1rem; bottom: 1rem; z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: .5rem; }
  #apipanel { max-width: 340px; padding: .8rem 1rem; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: .85rem; color: var(--muted); }
  #apipanel[hidden] { display: none; }
  #apipanel h4 { margin: 0 0 .4rem; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #apipanel .row + .row { margin-top: .5rem; }
  #apipanel .row.err { color: var(--accent); font-weight: 600; font-style: normal; }
  #infobtn { position: relative; width: 2.2rem; height: 2.2rem; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 1.05rem; line-height: 1; cursor: pointer; box-shadow: var(--shadow); }
  #infobtn:hover { color: var(--accent); border-color: var(--accent); }
  #infobtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #apiinfo.has-err #infobtn::after { content: ""; position: absolute; top: -.1rem; right: -.1rem; width: .55rem; height: .55rem; border-radius: 999px; background: var(--accent); border: 1px solid var(--panel); }

  /* layout */
  main { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  .pagehead { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; margin-bottom: .75rem; }
  h1 { margin: 0; font-size: 1.6rem; }
  h3 { margin: 0 0 .6rem; font-size: 1rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .card.pad { padding: 1rem; overflow: visible; margin-bottom: 1rem; }
  .filter, select { padding: .55rem .8rem; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); margin: 0 .5rem .9rem 0; }
  .filter { width: 320px; max-width: 100%; }
  .banner { padding: .6rem .9rem; border-radius: 8px; background: var(--panel2); color: var(--muted); margin-bottom: 1rem; font-style: italic; }
  .banner.error { background: var(--accent-soft); color: var(--accent); font-style: normal; font-weight: 600; }
  .empty { padding: 1.2rem; color: var(--muted); font-style: italic; margin: 0; }

  /* tables */
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th { text-align: left; padding: .65rem .8rem; background: var(--panel2); color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th.sorted { color: var(--accent); }
  td { padding: .6rem .8rem; border-top: 1px solid var(--border); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.click { cursor: pointer; }
  tr.click:hover { background: var(--accent-soft); }
  .tnum { color: var(--accent); }
  .pill { display: inline-block; min-width: 1.8rem; text-align: center; padding: .1rem .45rem; border-radius: 999px; background: var(--panel2); font-weight: 700; font-size: .8rem; }
  .pill.top { background: var(--accent); color: #fff; }

  /* team page */
  .teamhead { margin-bottom: 1rem; }
  .teamhead .big { font-size: 2.2rem; font-weight: 800; color: var(--accent); line-height: 1; }
  .teamhead .nm { font-size: 1.4rem; font-weight: 700; margin-left: .5rem; }
  .back { display: inline-block; margin-bottom: .6rem; color: var(--muted); font-size: .9rem; cursor: pointer; }
  .back:hover { color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: .8rem 1rem; box-shadow: var(--shadow); }
  .stat .l { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .stat .v { font-size: 1.8rem; font-weight: 800; margin: .1rem 0; font-variant-numeric: tabular-nums; }
  .stat .r { font-size: .8rem; color: var(--muted); }
  #tabs { display: flex; gap: .25rem; border-bottom: 2px solid var(--border); margin-bottom: 1rem; }
  .tab { border: none; background: none; color: var(--muted); padding: .6rem 1.1rem; font-size: .95rem; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .6rem; }
  .kv { background: var(--panel2); border-radius: 8px; padding: .6rem .8rem; }
  .kv span { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .kv strong { font-size: 1rem; }
  svg .cv { fill: var(--text); font-size: 11px; font-weight: 600; }
  svg .cl { fill: var(--muted); font-size: 10px; }
  .foot { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 2rem; }
</style>
</head>
<body>
<nav>
  <div class="nav-in">
    <a class="brand" href="#/teams">FTC Scouting</a>
    <div class="links">
      <a href="#/teams" data-page="teams">Championship</a>
      <a href="#/scrimmages" data-page="scrimmages">Scrimmages</a>
    </div>
    <div class="nav-right">
      <div class="search">
        <input id="gsearch" type="search" placeholder="Search team # or name…" autocomplete="off"
               oninput="gsearch()" onfocus="gsearch()" onkeydown="gkey(event)"
               onblur="setTimeout(() => $('gresults').hidden = true, 150)">
        <div id="gresults" hidden></div>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" onclick="toggleTheme()">
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main>
  <div id="app"></div>
  <p class="foot" id="updated"></p>
</main>

<div id="apiinfo">
  <div id="apipanel" hidden></div>
  <button id="infobtn" onclick="toggleApiInfo()" title="FTCScout status" aria-label="FTCScout status">i</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
const SHEET_ID = "1PWdTIUPcPH_HxHqmH5rk8OSlTxkeGzbelaZv0GlFBwA";
const SCRIMMAGE_TAB = "Scrimmages";   // name of the scrimmages tab in the Google Sheet
const REFRESH_MS = 30000;

// FTCScout API
const FTC_API = "https://api.ftcscout.org/rest/v1";
const REGION = "JM";       // FTCScout region code — "JM" = all Jamaican teams
const SEASON = 2026;       // season year of your championship
const EVENT_CODE = "JMCMP"; // championship event code — API match scores come from here
const ROSTER_FROM_API = true;  // show API teams in the Championship table even with no sheet rows
const API_INFO_FIRST = true;   // true = API name/org shows over the sheet; false = sheet shows

let teams = [], robots = [], matches = [], scrimmages = [];
let apiTeams = new Map();   // team number (string) -> { name, org, loc } from FTCScout
let apiMatches = [];        // match rows from FTCScout — one per team per match; the sheet is the fallback
const status = { champ: "Loading data…", scrim: "Loading scrimmages…", apiTeams: "", apiMatches: "" };
const errors = { champ: "", scrim: "", apiTeams: "", apiMatches: "" };
let lastUpdated = null;

const ui = {
  sort: { teams: { key: "rank", dir: 1 }, scrim: { key: "rank", dir: 1 } },
  teamQuery: "", scrimEvent: "", teamTab: "overview", apiInfoOpen: false
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toNum = v => { const x = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isNaN(x) ? 0 : x; };
const r1 = x => Math.round(x * 10) / 10;
const fmt = v => (v === null || v === undefined || v === "") ? "–" : v;
const titleCase = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
const go = h => { location.hash = h; };
const goTeam = n => go("#/team/" + encodeURIComponent(n));

// sheet loading
async function loadTab(name) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Couldn't load tab "${name}" (${res.status}). Check the tab name and that the sheet is shared as "Anyone with the link".`);
  const csv = await res.text();
  return Papa.parse(csv, { header: true, skipEmptyLines: true }).data
    .map(normalizeRow)
    .filter(r => Object.values(r).some(v => v !== ""));
}

// uppercase and trim every header so lookups are case insensitive
function normalizeRow(row) {
  const out = {};
  for (const key in row) {
    const k = key.trim().toUpperCase();
    if (k) out[k] = String(row[key] ?? "").trim();
  }
  return out;
}

// value of the first column whose header contains any of the given words
const col = (row, ...words) => {
  for (const k in row)
    if (words.some(w => k.includes(w.toUpperCase()))) return row[k];
  return "";
};

// all rows whose "number" column matches the given team number
const rowsFor = (rows, num) => rows.filter(r => col(r, "number") === String(num).trim());

// FTCScout API
function teamFields(p) {
  const inner = (p && typeof p === "object" && p.team) ? p.team : (p || {});
  return {
    number: String(inner.number ?? inner.teamNumber ?? "").trim(),
    name: inner.name || "",
    org: inner.schoolName || inner.organization || "",
    loc: [inner.city, inner.state, inner.country].filter(Boolean).join(", ")
  };
}

async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} from ${url.replace(FTC_API, "")}`);
  return res.json();
}

async function loadApiTeams() {
  if (!REGION && !EVENT_CODE) { status.apiTeams = ""; return; }
  try {
    const next = new Map();
    if (REGION) {
      const list = await fetchJson(`${FTC_API}/teams/search?region=${encodeURIComponent(REGION)}&limit=500`);
      list.forEach(p => {
        const f = teamFields(p);
        if (f.number) next.set(f.number, f);
      });
    }
    if (EVENT_CODE) {
      const teps = await fetchJson(`${FTC_API}/events/${SEASON}/${encodeURIComponent(EVENT_CODE)}/teams`);
      teps.forEach(p => {
        const f = teamFields(p);
        if (f.number && !next.has(f.number)) next.set(f.number, { name: "", org: "", loc: "" });
      });
    }
    if (!next.size) throw new Error("no teams returned");
    apiTeams = next;
    errors.apiTeams = "";
    status.apiTeams = `FTCScout: ${apiTeams.size} teams loaded for region "${REGION || "event " + EVENT_CODE}" — numbers, names & organizations auto-filled`;
  } catch (e) {
    status.apiTeams = "";
    errors.apiTeams = `FTCScout API: ${e.message} — using sheet data instead.`;
  }
  render();
}

// FTCScout publishes alliance-level scores only, so each team row carries its alliance's points.
function apiMatchRows(list) {
  const label = m =>
    m.tournamentLevel === "Quals" ? `Q${m.id}` :
    `${m.tournamentLevel === "DoubleElim" ? "DE" : m.tournamentLevel || "Match"} #${m.id}`;
  const rows = [];
  for (const m of list) {
    if (!m.hasBeenPlayed || !m.scores || !m.scores.red || !m.scores.blue) continue;
    for (const t of m.teams || []) {
      const s = m.scores[t.alliance === "Blue" ? "blue" : "red"];
      const o = m.scores[t.alliance === "Blue" ? "red" : "blue"];
      if (!s || s.totalPoints == null) continue;
      rows.push({
        NUMBER: String(t.teamNumber),
        MATCH: label(m),
        LEVEL: titleCase(m.tournamentLevel || ""),
        ALLIANCE: t.alliance || "",
        AUTO: s.autoPoints ?? "",
        TOTAL: s.totalPointsNp ?? s.totalPoints, // alliance score, penalties excluded
        RESULT: s.totalPoints > o.totalPoints ? "Win" : s.totalPoints < o.totalPoints ? "Loss" : "Tie"
      });
    }
  }
  return rows;
}

async function loadApiMatches() {
  if (!EVENT_CODE) return;
  try {
    const list = await fetchJson(`${FTC_API}/events/${SEASON}/${encodeURIComponent(EVENT_CODE)}/matches`);
    apiMatches = apiMatchRows(list);
    errors.apiMatches = "";
    status.apiMatches = apiMatches.length
      ? `FTCScout: ${apiMatches.length} match entries for "${SEASON} ${EVENT_CODE}" — championship scores come from the API`
      : `FTCScout: no match results for "${SEASON} ${EVENT_CODE}" yet — using the hand-typed sheet Matches tab`;
  } catch (e) {
    apiMatches = [];
    status.apiMatches = "";
    errors.apiMatches = `FTCScout matches: ${e.message} — using the hand-typed sheet Matches tab.`;
  }
  render();
}

// championship match rows: FTCScout first, hand-typed sheet as fallback
const champMatches = () => apiMatches.length ? apiMatches : matches;

async function loadAll() {
  // loaded independently so a missing scrimmage tab can't break the championship view
  const champ = (async () => {
    try {
      [teams, robots, matches] = await Promise.all([loadTab("Teams"), loadTab("Robot"), loadTab("Matches")]);
      errors.champ = "";
    } catch (e) { errors.champ = e.message; }
    status.champ = "";
    render();
  })();
  const scrim = (async () => {
    try { scrimmages = await loadTab(SCRIMMAGE_TAB); errors.scrim = ""; }
    catch (e) { errors.scrim = e.message; }
    status.scrim = "";
    render();
  })();
  await Promise.all([champ, scrim]);
  lastUpdated = new Date();
  render();
}

// aggregation
function agg(rows, field) {
  const v = rows.map(r => toNum(col(r, field)));
  if (!v.length) return { count: 0, avg: null, best: null, vals: v };
  return { count: v.length, avg: r1(v.reduce((a, b) => a + b, 0) / v.length), best: Math.max(...v), vals: v };
}

function allTeams() {
  const map = new Map();
  const put = (n, name, org) => {
    const e = map.get(n) || { number: n, name: "", org: "" };
    if (!e.name) e.name = name;
    if (!e.org) e.org = org;
    map.set(n, e);
  };
  [teams, scrimmages, matches, robots].forEach(rows => rows.forEach(r => {
    const n = col(r, "number");
    if (n) put(n, col(r, "name"), col(r, "organization", "org"));
  }));
  apiTeams.forEach((info, n) => {
    const e = map.get(n) || { number: n, name: "", org: "", loc: "" };
    if (info.loc) e.loc = info.loc;
    if (API_INFO_FIRST) {
      if (info.name) e.name = info.name;
      if (info.org) e.org = info.org;
    } else {
      if (!e.name && info.name) e.name = info.name;
      if (!e.org && info.org) e.org = info.org;
    }
    map.set(n, e);
  });
  return [...map.values()];
}

function rankBy(rows, key) {
  rows.filter(r => r.played && r[key] !== null).sort((a, b) => b[key] - a[key]).forEach((r, i) => { r.rank = i + 1; });
}

function champRows() {
  const mm = champMatches();
  const nums = new Set([...teams, ...mm].map(r => col(r, "number")).filter(Boolean));
  if (ROSTER_FROM_API) apiTeams.forEach((_, n) => nums.add(n));
  const info = new Map(allTeams().map(t => [t.number, t]));
  const rows = [...nums].map(n => {
    const s = agg(rowsFor(mm, n), "total");
    const i = info.get(n) || {};
    return { number: parseInt(n) || n, name: i.name || "", org: i.org || "", avg: s.avg, best: s.best, played: s.count, rank: null };
  });
  rankBy(rows, "avg");
  return rows;
}

const scrimNames = () => [...new Set(scrimmages.map(r => col(r, "scrimmage")).filter(Boolean))];
const scrimBase = () => ui.scrimEvent ? scrimmages.filter(r => col(r, "scrimmage") === ui.scrimEvent) : scrimmages;

function scrimRows() {
  const by = new Map();
  scrimBase().forEach(r => {
    const n = col(r, "number");
    if (!n) return;
    if (!by.has(n)) by.set(n, []);
    by.get(n).push(r);
  });
  const infos = new Map(allTeams().map(t => [t.number, t]));
  const rows = [...by].map(([n, rs]) => {
    const t = agg(rs, "total"), a = agg(rs, "auto"), p = agg(rs, "teleop"), f = agg(rs, "flower");
    const last = rs[rs.length - 1];
    const i = infos.get(n) || {};
    return {
      number: parseInt(n) || n, name: i.name || col(last, "name"), org: i.org || col(last, "organization", "org"),
      drivetrain: [...rs].reverse().map(r => col(r, "drivetrain")).find(Boolean) || "",
      auto: a.avg, teleop: p.avg, flower: f.avg, avgTotal: t.avg, best: t.best, played: t.count, rank: null
    };
  });
  rankBy(rows, "avgTotal");
  return rows;
}

// sorting table rendering
function sortRows(rows, { key, dir }) {
  const empty = v => v === null || v === undefined || v === "";
  return [...rows].sort((a, b) => {
    const x = a[key], y = b[key];
    if (empty(x) && empty(y)) return 0;
    if (empty(x)) return 1;
    if (empty(y)) return -1;
    if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
    return String(x).localeCompare(String(y), undefined, { numeric: true }) * dir;
  });
}

function setSort(group, key) {
  const s = ui.sort[group];
  if (s.key === key) s.dir *= -1;
  else { s.key = key; s.dir = ["name", "org", "drivetrain", "number", "rank"].includes(key) ? 1 : -1; }
  render();
}

function table(cols, rows, group) {
  const s = ui.sort[group];
  const head = cols.map(c =>
    `<th class="${c.num ? "num " : ""}sortable${s.key === c.key ? " sorted" : ""}" onclick="setSort('${group}','${c.key}')">${c.label}${s.key === c.key ? (s.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");
  const body = sortRows(rows, s).map(r =>
    `<tr class="click" data-n="${esc(r.number)}" onclick="goTeam(this.dataset.n)">${
      cols.map(c => `<td class="${c.num ? "num" : ""}">${c.render ? c.render(r) : esc(fmt(r[c.key]))}</td>`).join("")
    }</tr>`).join("");
  return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

const rankCell = r => r.rank ? `<span class="pill${r.rank <= 3 ? " top" : ""}">${r.rank}</span>` : "–";
const teamCell = r => `<strong class="tnum">${esc(r.number)}</strong>`;

const teamCols = [
  { key: "rank", label: "#", num: true, render: rankCell },
  { key: "number", label: "Team", render: teamCell },
  { key: "name", label: "Name" },
  { key: "org", label: "Organization" },
  { key: "avg", label: "Avg", num: true },
  { key: "best", label: "Best", num: true },
  { key: "played", label: "Matches", num: true }
];
const scrimCols = [
  { key: "rank", label: "#", num: true, render: rankCell },
  { key: "number", label: "Team", render: teamCell },
  { key: "name", label: "Name" },
  { key: "org", label: "Organization" },
  { key: "drivetrain", label: "Drivetrain" },
  { key: "auto", label: "Avg Auto", num: true },
  { key: "teleop", label: "Avg Teleop", num: true },
  { key: "flower", label: "Avg Flower", num: true },
  { key: "avgTotal", label: "Avg Total", num: true },
  { key: "best", label: "Best", num: true },
  { key: "played", label: "Entries", num: true }
];

// plain table of raw sheet rows (team page), hiding the team number column
function rawTable(rows) {
  if (!rows.length) return `<p class="empty">No data yet.</p>`;
  const nk = Object.keys(rows[0]).find(k => k.includes("NUMBER"));
  const cols = Object.keys(rows[0]).filter(k => k !== nk);
  const isNum = v => /^-?\d+(\.\d+)?$/.test(v);
  return `<div class="tablewrap"><table>
    <thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${isNum(r[c]) ? "num" : ""}">${esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

function chart(title, vals, labels) {
  if (!vals.length) return "";
  const step = 44, W = Math.max(320, vals.length * step + 40), H = 170, top = 22, bot = 24;
  const max = Math.max(...vals, 1), bw = 30;
  const bars = vals.map((v, i) => {
    const h = (H - top - bot) * v / max;
    const x = 20 + i * step + (step - bw) / 2, y = H - bot - h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, 1)}" rx="3" fill="var(--accent)" opacity=".85"/>
            <text class="cv" x="${x + bw / 2}" y="${y - 5}" text-anchor="middle">${v}</text>
            <text class="cl" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(labels[i])}</text>`;
  }).join("");
  return `<div class="card pad"><h3>${esc(title)}</h3><div class="tablewrap">
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(title)}">${bars}</svg></div></div>`;
}

const banner = k => errors[k] ? `<div class="banner error">${esc(errors[k])}</div>`
                  : status[k] ? `<div class="banner">${esc(status[k])}</div>` : "";

const statCard = (label, value, sub) =>
  `<div class="stat"><div class="l">${label}</div><div class="v">${esc(fmt(value))}</div><div class="r">${sub || "&nbsp;"}</div></div>`;

// PAGES
function pageTeams() {
  const q = ui.teamQuery.trim().toLowerCase();
  let rows = champRows();
  if (q) rows = rows.filter(r => String(r.number).toLowerCase().includes(q) || r.name.toLowerCase().includes(q) || r.org.toLowerCase().includes(q));
  return `${banner("champ")}
    <div class="pagehead"><h1>Championship Teams</h1><span class="muted">${rows.length} teams</span></div>
    <input id="teamQuery" class="filter" placeholder="Filter by number, name or organization…" value="${esc(ui.teamQuery)}"
           oninput="ui.teamQuery = this.value; render()">
    <div class="card">${rows.length ? table(teamCols, rows, "teams") : `<p class="empty">No teams found.</p>`}</div>`;
}

function pageScrims() {
  const names = scrimNames();
  if (ui.scrimEvent && !names.includes(ui.scrimEvent)) ui.scrimEvent = "";
  const rows = scrimRows();
  const base = scrimBase();
  const totals = agg(base, "total");
  const options = `<option value="">All scrimmages</option>` +
    names.map(n => `<option value="${esc(n)}"${n === ui.scrimEvent ? " selected" : ""}>${esc(n)}</option>`).join("");
  return `${banner("scrim")}
    <div class="pagehead"><h1>${ui.scrimEvent ? esc(ui.scrimEvent) : "Scrimmages"}</h1><span class="muted">${rows.length} teams</span></div>
    <select id="scrimEvent" onchange="ui.scrimEvent = this.value; render()">${options}</select>
    <div class="stats">
      ${statCard("Teams", rows.length)}
      ${statCard("Entries", totals.count)}
      ${statCard("High score", totals.best)}
      ${statCard("Average score", totals.avg)}
    </div>
    <div class="card">${rows.length ? table(scrimCols, rows, "scrim") : `<p class="empty">No data in the Scrimmages tab yet.</p>`}</div>`;
}

function setTab(t) { ui.teamTab = t; render(); }

function pageTeam(n) {
  const info = allTeams().find(t => t.number === n) || { name: "", org: "" };
  const mrows = rowsFor(champMatches(), n), srows = rowsFor(scrimmages, n);
  const robot = rowsFor(robots, n)[0];
  const ms = agg(mrows, "total"), ss = agg(srows, "total");
  const champ = champRows();
  const mine = champ.find(r => String(r.number) === n);
  const ranked = champ.filter(r => r.played).length;

  const tabs = [["overview", "Overview"], ["matches", `Matches (${mrows.length})`], ["scrims", `Scrimmages (${srows.length})`]];
  let body = "";
  if (ui.teamTab === "overview") {
    const kv = robot ? Object.entries(robot).filter(([k, v]) => !k.includes("NUMBER") && v)
      .map(([k, v]) => `<div class="kv"><span>${esc(titleCase(k))}</span><strong>${esc(v)}</strong></div>`).join("") : "";
    body = `
      <div class="card pad"><h3>Robot Info</h3>${kv ? `<div class="kv-grid">${kv}</div>` : `<p class="empty" style="padding:0">No robot info yet.</p>`}</div>
      ${chart("Championship match scores", ms.vals, mrows.map((r, i) => col(r, "match") || i + 1))}
      ${chart("Scrimmage scores", ss.vals, srows.map((r, i) => col(r, "scrimmage") || i + 1))}
      ${!ms.vals.length && !ss.vals.length ? `<p class="empty">No scores logged yet.</p>` : ""}`;
  } else if (ui.teamTab === "matches") {
    body = `<div class="card">${rawTable(mrows)}</div>`;
  } else {
    body = `<div class="card">${rawTable(srows)}</div>`;
  }

  return `<span class="back" onclick="history.back()">← Back</span>
    <div class="teamhead">
      <span class="big">${esc(n)}</span><span class="nm">${esc(info.name || "Unknown team")}</span>
      <div class="muted">${esc([info.org, info.loc].filter(Boolean).join(" · "))}</div>
    </div>
    <div class="stats">
      ${statCard("Avg match score", ms.avg, mine && mine.rank ? `Rank #${mine.rank} of ${ranked}` : "")}
      ${statCard("Best match", ms.best)}
      ${statCard("Matches logged", ms.count)}
      ${statCard("Avg scrimmage", ss.avg, ss.count ? `${ss.count} entries` : "")}
      ${statCard("Best scrimmage", ss.best)}
    </div>
    <div id="tabs">${tabs.map(([id, label]) =>
      `<button class="tab${ui.teamTab === id ? " active" : ""}" onclick="setTab('${id}')">${label}</button>`).join("")}</div>
    ${body}`;
}

// ROUTER
function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const [page, ...rest] = h.split("/");
  return { page: page || "teams", arg: decodeURIComponent(rest.join("/")) };
}

function render() {
  // keep focus and caret in a filter box / dropdown across re-renders
  const a = document.activeElement;
  const focusId = a && a.closest("#app") ? a.id : "";
  const pos = focusId && typeof a.selectionStart === "number" ? a.selectionStart : null;

  const { page, arg } = route();
  $("app").innerHTML = page === "team" ? pageTeam(arg) : page === "scrimmages" ? pageScrims() : pageTeams();
  document.querySelectorAll(".links a").forEach(l => l.classList.toggle("active", l.dataset.page === page));
  $("updated").textContent = lastUpdated ? `Updated ${lastUpdated.toLocaleTimeString()} · refreshes every ${REFRESH_MS / 1000}s` : "";
  renderApiInfo();

  if (focusId && $(focusId)) {
    const el = $(focusId);
    el.focus();
    if (pos !== null) { try { el.setSelectionRange(pos, pos); } catch (e) {} }
  }
}

window.addEventListener("hashchange", () => { ui.teamTab = "overview"; window.scrollTo(0, 0); render(); });

// GLOBAL SEARCH
function gsearch() {
  const q = $("gsearch").value.trim().toLowerCase();
  const box = $("gresults");
  if (!q) { box.innerHTML = ""; box.hidden = true; return; }
  const hits = allTeams()
    .filter(t => String(t.number).toLowerCase().includes(q) || t.name.toLowerCase().includes(q))
    .sort((a, b) => ((String(b.number).toLowerCase() === q) - (String(a.number).toLowerCase() === q)) || ((parseInt(a.number) || 0) - (parseInt(b.number) || 0)))
    .slice(0, 8);
  box.innerHTML = hits.length
    ? hits.map(t => `<div class="hit" data-n="${esc(t.number)}" onmousedown="openTeam(this.dataset.n)"><strong class="tnum">${esc(t.number)}</strong> ${esc(t.name)}</div>`).join("")
    : `<div class="hit muted">No matches</div>`;
  box.hidden = false;
}
function openTeam(n) { $("gsearch").value = ""; $("gresults").hidden = true; goTeam(n); }
function gkey(e) {
  if (e.key === "Escape") { $("gsearch").value = ""; gsearch(); return; }
  if (e.key !== "Enter") return;
  const first = $("gresults").querySelector(".hit[data-n]");
  const typed = $("gsearch").value.trim();
  if (first) openTeam(first.dataset.n);
  else if (/^\d+$/.test(typed)) openTeam(typed);
}

// THEME
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const btn = $("themeBtn");
  if (btn) {
    btn.title = t === "dark" ? "Switch to light mode" : "Switch to dark mode";
    btn.setAttribute("aria-label", btn.title);
    btn.setAttribute("aria-pressed", String(t === "dark"));
  }
}
function toggleTheme() {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem("ftcTheme", t); } catch (e) {}
}
(function initTheme() {
  let t = null;
  try { t = localStorage.getItem("ftcTheme"); } catch (e) {}
  if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(t);
})();

// FTCScout STATUS MENU
function apiInfoHTML() {
  const rows = [];
  if (status.apiTeams) rows.push(`<div class="row">${esc(status.apiTeams)}</div>`);
  if (errors.apiTeams) rows.push(`<div class="row err">${esc(errors.apiTeams)}</div>`);
  if (status.apiMatches) rows.push(`<div class="row">${esc(status.apiMatches)}</div>`);
  if (errors.apiMatches) rows.push(`<div class="row err">${esc(errors.apiMatches)}</div>`);
  if (!rows.length) rows.push(`<div class="row">No FTCScout status yet.</div>`);
  return `<h4>FTCScout</h4>${rows.join("")}`;
}

function renderApiInfo() {
  const info = $("apiinfo"), panel = $("apipanel");
  if (!info || !panel) return;
  panel.innerHTML = apiInfoHTML();
  panel.hidden = !ui.apiInfoOpen;
  info.classList.toggle("has-err", Boolean(errors.apiTeams || errors.apiMatches));
}

function toggleApiInfo() { ui.apiInfoOpen = !ui.apiInfoOpen; renderApiInfo(); }

document.addEventListener("click", (e) => {
  if (!ui.apiInfoOpen || (e.target.closest && e.target.closest("#apiinfo"))) return;
  ui.apiInfoOpen = false;
  renderApiInfo();
});

render();
loadApiTeams(); // roster from FTCScout
loadApiMatches(); // match scores from FTCScout — the sheet Matches tab is the fallback
loadAll(); // sheet tabs, then re loads every REFRESH_MS
setInterval(() => { loadAll(); loadApiMatches(); }, REFRESH_MS);
</script>
</body>
</html>
